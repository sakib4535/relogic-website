<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">Sazzad Hossain Pranto monogram</title>
  <desc id="desc">A blue and aqua monogram avatar for Sazzad Hossain Pranto.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#0c2433"/></linearGradient>
    <linearGradient id="type" x2="1" y2="1"><stop stop-color="#88f0df"/><stop offset="1" stop-color="#80bfff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#50d8c2" stop-opacity=".2"/><stop offset="1" stop-color="#50d8c2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9fc7e8" stroke-opacity=".055"/></pattern>
