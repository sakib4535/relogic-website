<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">Hassan Arif monogram</title>
  <desc id="desc">A cyan and violet monogram avatar for Hassan Arif.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071226"/><stop offset="1" stop-color="#15102e"/></linearGradient>
    <linearGradient id="type" x2="1" y2="1"><stop stop-color="#72e9f5"/><stop offset="1" stop-color="#b99aff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#34c7e0" stop-opacity=".2"/><stop offset="1" stop-color="#34c7e0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9fc7e8" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="720" height="920" fill="url(#bg)"/>
  <rect width="720" height="920" fill="url(#grid)"/>
  <circle cx="352" cy="410" r="340" fill="url(#glow)"/>
  <circle cx="360" cy="430" r="204" fill="#0c1a2c" stroke="#83eafa" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="360" cy="430" r="176" fill="none" stroke="#b99aff" stroke-opacity=".25"/>
  <path d="M210 550c82-83 218-83 300 0" fill="none" stroke="#72e9f5" stroke-opacity=".45" stroke-width="2"/>
  <text x="360" y="474" text-anchor="middle" fill="url(#type)" font-family="Inter,Arial,sans-serif" font-size="126" font-weight="700" letter-spacing="-8">HA</text>
  <text x="360" y="838" text-anchor="middle" fill="#b5c5d9" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">RELOGIC · CORE TEAM</text>
</svg>
